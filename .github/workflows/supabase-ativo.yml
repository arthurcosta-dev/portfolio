name: Supabase ativo

# O plano grátis do Supabase pausa o projeto depois de cerca de uma semana sem uso.
# Uma leitura por dia na tabela pública de destaques conta como uso e não altera nada.
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ler-destaques:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Lê a tabela pública de destaques
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "Faltam os secrets SUPABASE_URL e SUPABASE_PUBLISHABLE_KEY no repositório."
            exit 1
          fi
          status=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 30 \
            -H "apikey: $SUPABASE_PUBLISHABLE_KEY" \
            "$SUPABASE_URL/rest/v1/featured_projects?select=repo_name&limit=1")
          echo "Resposta do Supabase: $status"
          test "$status" = "200"
