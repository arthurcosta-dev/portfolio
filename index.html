<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <script>
      // Antes do React, para quem escolheu o tema claro não ver o escuro piscar.
      try {
        if (localStorage.getItem("theme") === "light") {
          document.documentElement.classList.remove("dark");
        }
      } catch {
        // Sem localStorage, o site segue no tema padrão, escuro.
      }
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfólio de Arthur Costa, desenvolvedor front-end em formação."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Arthur Costa</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
